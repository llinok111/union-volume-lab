name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Regenerate deterministic sample data
        run: node tools/gen-sample.mjs

      - name: Fail if the committed data/ is not byte-deterministic
        run: git diff --exit-code -- data/

      - name: Verify the volume-estimator assertions
        run: node bench/verify.mjs
