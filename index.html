<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>union-volume-lab — adaptive octree CSG volume scanner</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: ui-monospace, monospace; background: #0d1117; color: #e6edf3; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  #panel { padding: 18px; border-right: 1px solid #30363d; overflow-y: auto; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 11px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; margin: 12px 0 4px; }
  input[type=range] { width: 100%; }
  #view { position: relative; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  .card .row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .card .k { color: #8b949e; }
  .ok { color: #3fb950; font-weight: bold; }
  .bad { color: #f85149; font-weight: bold; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>union-volume-lab</h1>
    <div class="sub">Adaptive octree CSG union volume — dual-end bit-identical recompute (browser ↔ node)</div>

    <label for="split">Sphere separation d (0.0 … 2.2)</label>
    <input id="split" type="range" min="0" max="2.2" step="0.05" value="1" />

    <label for="depth">Octree depth (detail / error budget)</label>
    <input id="depth" type="range" min="4" max="7" step="1" value="6" />

    <div class="card">
      <div class="row"><span class="k">exact (closed form)</span><span id="exact"></span></div>
      <div class="row"><span class="k">adaptive (octree)</span><span id="adaptive"></span></div>
      <div class="row"><span class="k">cells (inside-tests)</span><span id="cells"></span></div>
      <div class="row"><span class="k">rel. error</span><span id="err"></span></div>
      <div class="row"><span class="k">bit-identical w/ node</span><span id="bitok"></span></div>
    </div>
  </aside>
  <div id="view"><canvas id="c"></canvas></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
